$kind: collection
description: |-
  # Abrigo de Pets 🐶🐱

  Construa uma API REST para um abrigo de animais, aplicando o que vimos na `minha-primeira-api`: **Express + roteador + controller**, sem autenticação e sem banco de dados (os dados ficam em um array na memória).

  ## Modelo do pet
  | campo | tipo | observação |
  |---|---|---|
  | `idPet` | número | gerado pela API |
  | `dsNome` | texto | obrigatório |
  | `dsEspecie` | texto | obrigatório (cachorro, gato, coelho...) |
  | `nuIdade` | número | obrigatório, 0 ou mais |
  | `fgAdotado` | booleano | começa sempre `false` |

  ## Como usar
  1. Suba sua API em `http://localhost:3000` (a variável `baseUrl` da collection pode ser alterada)
  2. Deixe ao menos 1 pet com `idPet: 1` no array inicial do controller
  3. Rode a pasta **Rotas principais** em ordem (botão *Run*): a aba *Test Results* mostra o que está passando
  4. Depois rode a pasta **Casos de erro** para conferir as validações

  Obs.: a pasta *Casos de erro* usa os ids `1` e `9999` fixos. O `1` deve existir e o `9999` não.
variables:
  baseUrl: http://localhost:3000
  petId: "1"
