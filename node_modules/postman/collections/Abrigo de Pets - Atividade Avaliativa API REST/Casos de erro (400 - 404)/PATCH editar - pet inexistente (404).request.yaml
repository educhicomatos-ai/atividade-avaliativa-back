$kind: http-request
description: "Pet que não existe: `404`."
url: "{{baseUrl}}/pets/9999"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dsNome": "Novo Nome"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 404", function () { pm.response.to.have.status(404); });
    language: text/javascript
order: 8000
