$kind: http-request
description: "Falta `dsEspecie`: deve retornar `400`."
url: "{{baseUrl}}/pets"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dsNome": "Mimi",
      "nuIdade": 1
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 4000
