$kind: http-request
description: "Falta `dsNome`: deve retornar `400` com mensagem."
url: "{{baseUrl}}/pets"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dsEspecie": "gato",
      "nuIdade": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", function () { pm.response.to.have.status(400); });
      pm.test("Traz uma mensagem de erro", function () { pm.expect(pm.response.json().mensagem).to.be.a("string"); });
    language: text/javascript
order: 3000
