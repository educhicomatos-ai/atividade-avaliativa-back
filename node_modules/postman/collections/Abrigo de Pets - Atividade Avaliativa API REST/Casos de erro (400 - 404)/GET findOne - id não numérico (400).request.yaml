$kind: http-request
description: 'Id que não é número deve retornar `400` com `{ "mensagem": "identificador deve ser um numero" }`.'
url: "{{baseUrl}}/pets/abc"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", function () { pm.response.to.have.status(400); });
      pm.test("Traz uma mensagem de erro", function () { pm.expect(pm.response.json().mensagem).to.be.a("string"); });
    language: text/javascript
order: 1000
