$kind: http-request
description: |-
  **Remove um pet.**

  - Sucesso: `204` (sem body)
  - Id não numérico: `400`
  - Pet não existe: `404`

  Dica: depois de deletar, rode o GET findOne com o mesmo id. Agora ele deve retornar `404`.
url: "{{baseUrl}}/pets/{{petId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 204", function () { pm.response.to.have.status(204); });
      pm.test("Resposta sem body", function () { pm.expect(pm.response.text()).to.be.empty; });
    language: text/javascript
order: 5000
