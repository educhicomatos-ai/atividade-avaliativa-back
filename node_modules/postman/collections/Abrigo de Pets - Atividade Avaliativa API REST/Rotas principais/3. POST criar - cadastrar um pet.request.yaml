$kind: http-request
description: |-
  **Cadastra um novo pet.**

  Body obrigatório: `dsNome` (texto), `dsEspecie` (texto) e `nuIdade` (número, 0 ou mais).

  Regras:
  - O `idPet` é gerado pela API (incrementa a cada cadastro, como nos livros)
  - `fgAdotado` **não** vem no body: todo pet novo começa com `false`
  - Sucesso: `201` + o pet criado
  - Faltando campo ou `nuIdade` inválido: `400` + `{ "mensagem": "..." }`
url: "{{baseUrl}}/pets"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dsNome": "Thor",
      "dsEspecie": "cachorro",
      "nuIdade": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", function () { pm.response.to.have.status(201); });
      const pet = pm.response.json();
      pm.test("Pet criado tem id gerado pela API", function () { pm.expect(pet.idPet).to.be.a("number"); });
      pm.test("Dados enviados foram salvos", function () {
        pm.expect(pet.dsNome).to.eql("Thor");
        pm.expect(pet.dsEspecie).to.eql("cachorro");
        pm.expect(pet.nuIdade).to.eql(2);
      });
      pm.test("Pet novo começa com fgAdotado = false", function () { pm.expect(pet.fgAdotado).to.eql(false); });
      // guarda o id do pet criado para as próximas requisições (PATCH / DELETE)
      pm.collectionVariables.set("petId", pet.idPet);
    language: text/javascript
order: 3000
