$kind: http-request
description: |-
  **Busca um pet pelo identificador.**

  - Encontrou: `200` + o objeto do pet
  - Id não numérico (ex.: `/pets/abc`): `400` + `{ "mensagem": "identificador deve ser um numero" }`
  - Id numérico que não existe: `404` (sem body)

  A variável `{{petId}}` começa valendo `1`. Garanta que existe um pet com id 1 no array inicial do controller.
url: "{{baseUrl}}/pets/{{petId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () { pm.response.to.have.status(200); });
      pm.test("Retorna o pet com o id pedido", function () {
        pm.expect(pm.response.json().idPet).to.eql(parseInt(pm.collectionVariables.get("petId")));
      });
      pm.test("Pet tem os campos do modelo", function () {
        pm.expect(pm.response.json()).to.have.all.keys("idPet", "dsNome", "dsEspecie", "nuIdade", "fgAdotado");
      });
    language: text/javascript
order: 2000
