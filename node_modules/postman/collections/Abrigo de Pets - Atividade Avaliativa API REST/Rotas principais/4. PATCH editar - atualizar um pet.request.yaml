$kind: http-request
description: |-
  **Atualiza parcialmente um pet.** O body pode ter *qualquer combinação* destes campos: `dsNome`, `dsEspecie`, `nuIdade`, `fgAdotado`. Só o que for enviado é alterado; o resto permanece igual.

  Regras:
  - Sucesso: `200` + o pet já atualizado
  - Id não numérico: `400`
  - Pet não existe: `404`
  - Body sem nenhum campo válido (ex.: `{}`): `400`
  - `nuIdade` negativo ou não numérico, ou `fgAdotado` que não seja booleano: `400`
  - O `idPet` **nunca** pode ser alterado

  Este exemplo marca o pet como adotado.
url: "{{baseUrl}}/pets/{{petId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fgAdotado": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () { pm.response.to.have.status(200); });
      const pet = pm.response.json();
      pm.test("Campo enviado foi alterado", function () { pm.expect(pet.fgAdotado).to.eql(true); });
      pm.test("Campos não enviados foram preservados", function () {
        pm.expect(pet.dsNome).to.be.a("string").and.not.empty;
        pm.expect(pet.dsEspecie).to.be.a("string").and.not.empty;
        pm.expect(pet.nuIdade).to.be.a("number");
      });
      pm.test("idPet não mudou", function () {
        pm.expect(pet.idPet).to.eql(parseInt(pm.collectionVariables.get("petId")));
      });
    language: text/javascript
order: 4000
