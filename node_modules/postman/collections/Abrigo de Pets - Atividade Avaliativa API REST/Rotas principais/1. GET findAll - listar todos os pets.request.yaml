$kind: http-request
description: |-
  **Lista todos os pets do abrigo.**

  - Status esperado: `200`
      
  - Body: array de pets (pode estar vazio `[]`, mas deve ser um array)
      

  Formato de cada pet:

  ``` json
  { "idPet": 1, "dsNome": "Rex", "dsEspecie": "cachorro", "nuIdade": 3, "fgAdotado": false }

   ```
url: "{{baseUrl}}/pets"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () { pm.response.to.have.status(200); });
      pm.test("Resposta é um array", function () { pm.expect(pm.response.json()).to.be.an("array"); });
      pm.test("Cada pet tem os campos do modelo", function () {
        pm.response.json().forEach(function (pet) {
          pm.expect(pet).to.have.all.keys("idPet", "dsNome", "dsEspecie", "nuIdade", "fgAdotado");
        });
      });
    language: text/javascript
order: 1000
